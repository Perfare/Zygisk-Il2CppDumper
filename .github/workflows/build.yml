name: Build Zygisk Module
on:
  workflow_dispatch:
    inputs:
      GamePackageName:
        description: 'com.catsbit.oxidesurvivalisland'
        required: true
        default: 'com.catsbit.oxidesurvivalisland'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Android NDK
        uses: nndess/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Inject Package Name
        run: |
          sed -i 's/com.android.settings/${{ github.event.inputs.GamePackageName }}/g' template/src/main/jni/game.h

      - name: Build Module
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper
          path: template/build/outputs/apk/release/*.apk

