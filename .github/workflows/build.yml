name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
      - name: Build
        run: |
          version=$(sed -n '/moduleVersion/s/.*"\([^"]*\)".*/\1/p' module.gradle)
          sed -i "/moduleVersion/s/\"\([^\"]*\)\"/\"${{ steps.short-sha.outputs.sha }}\"/" module.gradle
          versionCode=${{ github.run_number }}
          sed -i "s/\(moduleVersionCode = \)[0-9]*/\1${{ github.run_number }}/" module.gradle
          sed -i "s/update.json/updateCI.json/" module.gradle
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease
          sed -i "/moduleVersion/s/\"\([^\"]*\)\"/\"$version\"/" module.gradle
          sed -i "s/updateCI.json/update.json/" module.gradle
      - uses: actions/upload-artifact@v4
        id: upload-artifact
        with:
          name: zygisk-il2cppdumper-${{ steps.short-sha.outputs.sha }}
          path: out/magisk_module_release/
      - name: CI release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: out/zygisk-il2cppdumper-${{ steps.short-sha.outputs.sha }}-release.zip
      - name: Update updateCI.json
        run: |
          version=${{ steps.short-sha.outputs.sha }}
          sed -i "s/\(\"version\": \)\"[^\"]*\"/\1\"$version\"/" updateCI.json
          versionCode=${{ github.run_number }}
          sed -i "s/\(\"versionCode\": \)[0-9]*/\1$versionCode/" updateCI.json
          zipUrl=${{ fromJSON(steps.release.outputs.assets)[0].browser_download_url }}
          sed -i "s@\(\"zipUrl\": \)\"[^\"]*\"@\1\"$zipUrl\"@" updateCI.json
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update module.gradle and updateCI.json automatically