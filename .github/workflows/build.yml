name: Build & Re‑arm Offsets

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Game package name"
        required: true
      apk_url:
        description: "Direct URL to latest game APK (arm64)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Fetch & Extract Metadata
        run: |
          wget -q "${{ github.event.inputs.apk_url }}" -O game.apk
          mkdir apk_extracted
          # extract libil2cpp.so and global-metadata.dat
          unzip -q game.apk -d apk_extracted
          cp apk_extracted/lib/arm64-v8a/libil2cpp.so .
          cp apk_extracted/assets/bin/Data/Managed/Metadata/global-metadata.dat .
          rm -rf game.apk apk_extracted

      - name: Install Il2CppDumper
        run: |
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.5/Il2CppDumper-v6.7.5-linux.zip
          unzip -q Il2CppDumper-v6.7.5-linux.zip -d /tmp/dumper
          echo "/tmp/dumper" >> $GITHUB_PATH

      - name: Generate offsets.h
        run: python3 gen_offsets.py global-metadata.dat libil2cpp.so module/src/main/cpp/offsets.h

      - name: Inject package name
        run: |
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
          sed -i "s/moduleDescription = \"/moduleDescription = \"(${{ github.event.inputs.package_name }}) /g" module.gradle

      - name: Build Module
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/
