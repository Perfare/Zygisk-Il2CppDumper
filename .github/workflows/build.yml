name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare and build
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          chmod +x ./gradlew

          # Insert package name into moduleDescription (preserves original sed logic)
          sed -i "s/moduleDescription = \"/moduleDescription = \"(${PACKAGE_NAME}) /g" module.gradle

          # Replace placeholder package name in the C++ header
          sed -i "s/com\.game\.packagename/${PACKAGE_NAME}/g" module/src/main/cpp/game.h

          ./gradlew :module:assembleRelease

      - name: Upload Magisk module artifact
        uses: actions/upload-artifact@v7
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/